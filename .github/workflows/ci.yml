name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  integration:
    # Runs the workerd runtime (via `wrangler pages dev`) against the real
    # functions/ tree and exercises every endpoint via HTTP. Catches issues
    # the Node-based unit tests cannot — module loading, KV semantics, edge
    # runtime API differences, Wrangler bundling.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Integration tests (workerd via wrangler pages dev)
        run: npm run test:integration

  schema-drift:
    runs-on: ubuntu-latest
    # Drift gate runs only when @visibilio/shared-types is installed
    # (i.e. once that package is publishly available on npm). Until then
    # the script no-ops with a warning, so this job is informational.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify vendored schema matches @visibilio/shared-types
        run: npm run vendor:check
